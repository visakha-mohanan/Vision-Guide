<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile | VisionGuide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');

        /* ===== Theme Variables ===== */
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --accent: #16a34a;
            --accent-hover: #15803d;
            --border-color: #e2e8f0;
        }

        body.dark {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #e6edf3;
            --accent: #58a6ff;
            --accent-hover: #2ea043;
            --border-color: #30363d;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            background-color: var(--card-bg);
            color: var(--text-color);
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            background-color: var(--card-bg);
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        input {
            background-color: var(--card-bg);
            color: var(--text-color);
            border-color: var(--border-color);
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        /* Theme toggle button */
        .theme-toggle {
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--accent);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            background-color: var(--accent-hover);
            color: white;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col transition-all duration-300">

    <!-- Header with theme toggle -->
    <header class="shadow-md p-4 flex justify-between items-center sticky top-0 z-10">
        <div class="text-2xl font-bold text-green-600 dark:text-blue-400">VisionGuide</div>
        <nav class="flex items-center gap-3">
            <a href="{{ url_for('dashboard') }}" class="text-gray-600 dark:text-gray-300 hover:text-green-600 dark:hover:text-blue-400 px-3 py-2 rounded-md transition duration-150">Dashboard</a>
            <a href="{{ url_for('logout') }}" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-md shadow-lg transition duration-150">Logout</a>
            <!-- 🌙 Theme toggle button -->
            <button id="themeToggle" class="theme-toggle" title="Toggle Theme">🌙</button>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto p-4 sm:p-8 transition-all duration-300">
        <div class="max-w-4xl mx-auto p-6 sm:p-10 rounded-xl shadow-2xl border border-gray-100 container">

            <h1 class="text-3xl sm:text-4xl font-extrabold mb-6 border-b pb-2">
                My Profile
            </h1>

            <!-- Message Box -->
            <div id="message-box" class="hidden p-3 mb-4 rounded-lg text-sm transition-opacity duration-300" role="alert"></div>

            <form id="profile-form" action="{{ url_for('profile_page') }}" method="POST">
                
                <!-- Personal Information Section -->
                <div class="space-y-6">
                    <div>
                        <label for="username" class="block text-sm font-medium mb-1">Username</label>
                        <input type="text" id="username" name="username" required 
                               value="{{ user.username if user.username else '' }}" 
                               class="mt-1 block w-full px-4 py-2 border rounded-lg shadow-sm focus:ring-green-500 focus:border-green-500 transition duration-150">
                    </div>

                    <div>
                        <label for="email" class="block text-sm font-medium mb-1">Email Address</label>
                        <input type="email" id="email" name="email" required 
                               value="{{ user.email if user.email else '' }}" 
                               class="mt-1 block w-full px-4 py-2 border rounded-lg shadow-sm focus:ring-green-500 focus:border-green-500 transition duration-150" disabled>
                        <p class="mt-1 text-xs opacity-80">Email cannot be changed here.</p>
                    </div>
                    
                    <div>
                        <label for="location" class="block text-sm font-medium mb-1">Location / City</label>
                        <input type="text" id="location" name="location" 
                               value="{{ user.location if user.location else '' }}" 
                               placeholder="e.g., San Francisco, CA"
                               class="mt-1 block w-full px-4 py-2 border rounded-lg shadow-sm focus:ring-green-500 focus:border-green-500 transition duration-150">
                    </div>

                    <div>
                        <label for="date_of_birth" class="block text-sm font-medium mb-1">Date of Birth</label>
                        <input type="date" id="date_of_birth" name="date_of_birth" 
                               value="{{ user.date_of_birth if user.date_of_birth else '' }}" 
                               class="mt-1 block w-full px-4 py-2 border rounded-lg shadow-sm focus:ring-green-500 focus:border-green-500 transition duration-150">
                    </div>
                </div>

                <!-- Submission Button -->
                <div class="mt-10">
                    <button type="submit" id="save-button" 
                            class="w-full sm:w-auto px-6 py-3 border border-transparent text-base font-medium rounded-lg shadow-lg text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition duration-150 ease-in-out">
                        Save Changes
                    </button>
                    <div id="loading-spinner" class="hidden ml-4 inline-block h-6 w-6 animate-spin rounded-full border-4 border-solid border-current border-e-transparent align-[-0.125em] text-green-600" role="status">
                        <span class="!absolute !-m-px !h-px !w-px !overflow-hidden !whitespace-nowrap !border-0 !p-0 ![clip:rect(0,0,0,0)]">Loading...</span>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <script>
        const profileForm = document.getElementById('profile-form');
        const messageBox = document.getElementById('message-box');
        const saveButton = document.getElementById('save-button');
        const loadingSpinner = document.getElementById('loading-spinner');
        const themeToggle = document.getElementById('themeToggle');

        // ===== Theme Toggle =====
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark');
            themeToggle.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
        });

        // ===== Message display =====
        function showMessage(message, type = 'success') {
            messageBox.textContent = message;
            messageBox.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
            
            if (type === 'error') {
                messageBox.classList.add('bg-red-100', 'text-red-700');
            } else {
                messageBox.classList.add('bg-green-100', 'text-green-700');
            }
            setTimeout(() => {
                messageBox.classList.add('hidden');
            }, 4000);
        }

        profileForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            saveButton.disabled = true;
            saveButton.textContent = 'Saving...';
            loadingSpinner.classList.remove('hidden');

            const formData = new FormData(profileForm);
            const body = new URLSearchParams();
            for (const pair of formData) {
                body.append(pair[0], pair[1]);
            }

            try {
                const response = await fetch(profileForm.action, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: body
                });

                const data = await response.json();
                if (data.success) {
                    showMessage(data.message, 'success');
                } else {
                    showMessage(data.message || 'Failed to update profile.', 'error');
                }
            } catch (error) {
                console.error('Fetch error:', error);
                showMessage('An error occurred while connecting to the server.', 'error');
            } finally {
                saveButton.disabled = false;
                saveButton.textContent = 'Save Changes';
                loadingSpinner.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
